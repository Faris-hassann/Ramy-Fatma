ees.\",\"bento3Title\":\"Invite without limits\",\"bento3Desc\":\"Send your invitation to as many guests as you want, with each name personalized, no cap.\",\"bento4Title\":\"Ready in minutes\",\"bento4Desc\":\"Pick a template, fill in your details, share a link or QR. Edit anytime and guests see it instantly.\",\"pricingLabel\":\"One-time payment, yours forever\",\"pricingDesc\":\"No monthly fees.\",\"returningTitle\":\"From your 2nd invitation\",\"returningDesc\":\"Many couples need multiple invitations for different groups: groom's side, bride's side, friends, colleagues. Get 50% off from your 2nd invitation onward.\",\"step1Title\":\"Create for Free\",\"step1Desc\":\"Choose a template, fill in your details, and customize freely. Completely free, no sign-up required.\",\"step2Title\":\"Free 3-Day Trial\",\"step2Desc\":\"Share your invitation for guests to preview. Full features, up to 20 guests.\",\"step3Title\":\"Pay Only When Happy\",\"step3Desc\":\"Only pay if you love it. Once paid, your invitation is valid forever.\",\"faq1Q\":\"What is the free trial?\",\"faq1A\":\"When you create and publish your invitation, you get a **3-day free trial** with all features. During this time, you can share your invitation with guests to preview.\\n\\nAfter 3 days, if you're happy, a one-time payment keeps your invitation forever. If not, no payment needed!\",\"faq2Q\":\"How long does the invitation last?\",\"faq2A\":\"**Forever!** Once paid, your invitation will always be active. No monthly or annual fees. One payment, lifetime access.\\n\\nYour invitation becomes a beautiful digital keepsake you can revisit anytime.\",\"faq3Q\":\"What's included for {price}?\",\"faq3A\":\"For {price}, you get everything:\\n\\n- Unlimited guest views\\n- Invitation valid forever\\n- Guest name display\\n- Download invitation as video and image\\n- Google Maps navigation\\n- Unlimited photo gallery\\n- Gift QR Code\\n- Detailed guest stats\",\"faq4Q\":\"Are there any recurring fees?\",\"faq4A\":\"**No!** Just a one-time payment. No hidden fees, no maintenance charges, no renewals. Your invitation runs forever with no additional costs.\",\"faq5Q\":\"Why would I need multiple invitations?\",\"faq5A\":\"Many couples create separate invitations for different guest groups:\\n\\n- **Groom's \u0026 bride's families:** Different reception info, venues, and times.\\n- **Friends \u0026 colleagues:** A more casual tone compared to the family invitation.\\n- **Out-of-town guests:** Include accommodation and transport info.\\n\\nFrom your 2nd invitation, it's only **{returningPrice}** (50% off), saving you money.\",\"faq6Q\":\"Can I edit after paying?\",\"faq6A\":\"**Yes!** You can edit freely after payment:\\n\\n- Update couple info, parents, date, time, and venue\\n- Change photos, music, and update the map\\n- Switch invitation templates (content stays the same)\\n\\nAll changes update instantly, with no need to resend links to guests.\",\"faq7Q\":\"What's the fastest way to make a 2nd invitation?\",\"faq7A\":\"Use the **Duplicate** feature on your dashboard. Duplicating creates a new invitation with all the original content (names, photos, music, map, etc.), so you just update what's different.\\n\\nPerfect when you need separate invitations for the groom's and bride's sides: just change the venue and time.\",\"faq8Q\":\"How do I pay?\",\"faq8A\":\"ChungDoi supports **bank transfer** payment. After clicking Pay, a QR code is generated. Scan it with your banking app and your invitation will be activated within seconds.\\n\\nYou can also scan the QR code or manually enter the account number shown on screen.\",\"faq8ACard\":\"ChungDoi supports secure international checkout via **Visa, Mastercard, Apple Pay and Google Pay**, through our secure card payment partner. After clicking Pay, you're taken to a secure checkout page.\\n\\nOnce payment succeeds, your invitation is activated automatically. Every transaction is encrypted and protected.\\n\\nPrices are shown before local tax; the total at checkout includes any tax that applies in your country. If your card is billed in a different currency, your bank sets the final exchange rate and some cards add a foreign-transaction fee.\",\"faq9Q\":\"What is your refund policy?\",\"faq9A\":\"You get a **3-day free trial** with every feature: view the real invitation, share it with family, and adjust it until it feels right, all before paying. So you only pay once you are genuinely happy, and after an invitation is activated we do not offer change-of-mind refunds.\\n\\nWe do still refund clear cases: **duplicate charges**, **an outage we cannot fix within 7 days**, or an **unauthorized charge** you did not make. Anything exceptional we look at case by case.\\n\\nMessage us in chat (fastest) or email **hello@chungdoi.com** with your transaction ID and we will respond within 3 business days. Please tell us within 30 days of payment. Full details are on our refund policy page.\",\"schemaName\":\"Online Wedding Invitations - ChungDoi\",\"approxLocalNoteWithTax\":\"incl. tax\",\"approxLocalHint\":\"Prices are shown before local tax; the total at checkout includes any tax that applies in your country. If your card is billed in a different currency, your bank sets the final exchange rate and some cards add a foreign-transaction fee.\",\"approxLocalHintTaxIncluded\":\"Prices include any tax that applies in your country, so the card page charges the price shown. If your card is billed in a different currency, your bank sets the final exchange rate and some cards add a foreign-transaction fee.\",\"approxLocalInfoLabel\":\"Price details\"},\"login\":{\"redirecting\":\"Redirecting...\"},\"signup\":{\"redirecting\":\"Redirecting...\"},\"homeTools\":{\"title1\":\"Free\",\"title2\":\"Tools\",\"subtitle\":\"Your wedding planning helpers\",\"tool1Title\":\"Write Wedding Invitation Messages\",\"tool1Desc\":\"Let AI write a polished invitation message for you\",\"tool2Title\":\"Image Compression\",\"tool2 "faq1Q\":\"ما هي الفترة التجريبية المجانية؟\",\"faq1A\":\"حين تنشئ دعوتك وتنشرها، تحصل على **تجربة مجانية لمدة 3 أيام** بجميع الميزات. خلال هذه المدة، يمكنك مشاركة دعوتك مع الضيوف ليطّلعوا عليها.\\n\\nبعد 3 أيام، إن أعجبتك، فإن دفعة واحدة تحفظ دعوتك إلى الأبد. وإن لم تعجبك، فلا حاجة للدفع!\",\"faq2Q\":\"كم تدوم الدعوة؟\",\"faq2A\":\"**إلى الأبد!** بمجرد الدفع، تبقى دعوتك نشطة دائمًا. بلا رسوم شهرية أو سنوية. دفعة واحدة، ووصول مدى الحياة.\\n\\nتصبح دعوتك تذكارًا رقميًا جميلًا يمكنك العودة إليه في أي وقت.\",\"faq3Q\":\"ما الذي يتضمّنه مبلغ {price}؟\",\"faq3A\":\"مقابل {price}، تحصل على كل شيء:\\n\\n- مشاهدات غير محدودة للضيوف\\n- دعوة صالحة إلى الأبد\\n- عرض أسماء الضيوف\\n- تنزيل الدعوة بصيغة فيديو وصورة\\n- تنقّل عبر خرائط Google\\n- معرض صور غير محدود\\n- رمز QR للهدايا\\n- إحصاءات تفصيلية للضيوف\",\"faq4Q\":\"هل توجد أي رسوم متكررة؟\",\"faq4A\":\"**لا!** مجرد دفعة واحدة. بلا رسوم خفية، ولا رسوم صيانة، ولا تجديدات. تعمل دعوتك إلى الأبد دون أي تكاليف إضافية.\",\"faq5Q\":\"لماذا قد أحتاج إلى عدة دعوات؟\",\"faq5A\":\"ينشئ كثير من العروسين دعوات منفصلة لمجموعات ضيوف مختلفة:\\n\\n- **عائلتا العريس والعروس:** معلومات استقبال وأماكن وأوقات مختلفة.\\n- **الأصدقاء والزملاء:** طابع أكثر تحرّرًا مقارنةً بدعوة العائلة.\\n- **الضيوف من خارج المدينة:** تتضمّن معلومات الإقامة والتنقّل.\\n\\nابتداءً من دعوتك الثانية، تكلفتها **{returningPrice}** فقط (خصم 50%)، ما يوفّر عليك المال.\",\"faq6Q\":\"هل يمكنني التعديل بعد الدفع؟\",\"faq6A\":\"**نعم!** يمكنك التعديل بحرية بعد الدفع:\\n\\n- تحديث معلومات العروسين والوالدين والتاريخ والوقت والمكان\\n- تغيير الصور والموسيقى وتحديث الخريطة\\n- تبديل قوالب الدعوة (يبقى المحتوى كما هو)\\n\\nتُحدّث جميع التغييرات فورًا، دون الحاجة إلى إعادة إرسال الروابط للضيوف.\",\"faq7Q\":\"ما أسرع طريقة لإنشاء دعوة ثانية؟\",\"faq7A\":\"استخدم ميزة **النسخ** في لوحة التحكم. يؤدّي النسخ إلى إنشاء دعوة جديدة بكل المحتوى الأصلي (الأسماء والصور والموسيقى والخريطة وغيرها)، وما عليك سوى تحديث ما يختلف.\\n\\nمثالية حين تحتاج إلى دعوتين منفصلتين لجهتي العريس والعروس، فقط غيّر المكان والوقت.\",\"faq8Q\":\"كيف أدفع؟\",\"faq8A\":\"يدعم ChungDoi الدفع عبر **التحويل المصرفي**. بعد الضغط على دفع، يُنشأ رمز QR. امسحه بتطبيق البنك الخاص بك وستُفعّل دعوتك خلال ثوانٍ.\\n\\nيمكنك أيضًا مسح رمز QR أو إدخال رقم الحساب الظاهر على الشاشة يدويًا.\",\"faq8ACard\":\"يدعم ChungDoi الدفع الدولي الآمن عبر **Visa وMastercard وApple Pay وGoogle Pay** عبر شريك الدفع بالبطاقة الآمن لدينا. بعد الضغط على دفع، تنتقل إلى صفحة دفع آمنة.\\n\\nوبمجرد نجاح الدفع، تُفعّل دعوتك تلقائيًا. وكل معاملة مُشفّرة ومحمية.\\n\\nتُعرض الأسعار قبل الضريبة المحلية، ويشمل الإجمالي عند الدفع الضريبة المطبّقة في بلدك. وإذا تم خصم المبلغ من بطاقتك بعملة أخرى، فإن بنكك يحدد سعر الصرف النهائي وقد تضيف بعض البطاقات رسوم معاملة خارجية.\",\"faq9Q\":\"ما سياسة استرداد الأموال لديكم؟\",\"faq9A\":\"لديك **تجربة مجانية لمدة 3 أيام** بكل المزايا: تشاهد الدعوة الحقيقية، وتشاركها مع عائلتك، وتعدّلها حتى تعجبك، كل ذلك قبل الدفع. لذلك أنت لا تدفع إلا بعد أن ترضى فعلاً، وبعد تفعيل الدعوة لا نقدم استردادًا لتغيّر الرأي.\\n\\nما زلنا نسترد في الحالات الواضحة: **الرسوم المكررة**، أو **عطل لا نستطيع حله خلال 7 أيام**، أو **رسوم غير مصرح بها** لم تقم بها. أما الحالات الاستثنائية فننظر فيها كل حالة على حدة.\\n\\nراسلنا في المحادثة (الأسرع) أو على **hello@chungdoi.com** مع رقم معاملتك وسنرد خلال 3 أيام عمل. يُرجى إبلاغنا خلال 30 يومًا من الدفع. التفاصيل الكاملة في صفحة سياسة الاسترداد.\",\"schemaName\":\"دعوات الزفاف الإلكترونية - ChungDoi\",\"approxLocalNoteWithTax\":\"شامل الضريبة\",\"approxLocalHint\":\"تُعرض الأسعار قبل الضريبة المحلية، ويشمل الإجمالي عند الدفع الضريبة المطبّقة في بلدك. وإذا تم خصم المبلغ من بطاقتك بعملة أخرى، فإن بنكك يحدد سعر الصرف النهائي وقد تضيف بعض البطاقات رسوم معاملة خارجية.\",\"approxLocalHintTaxIncluded\":\"تشمل الأسعار الضريبة المطبّقة في بلدك، لذا تخصم صفحة الدفع بالبطاقة السعر المعروض نفسه. وإذا تم خصم المبلغ من بطاقتك بعملة أخرى، فإن بنكك يحدد سعر الصرف النهائي وقد تضيف بعض البطاقات رسوم معاملة خارجية.\",\"approxLocalInfoLabel\":\"تفاصيل السعر\"},\"login\":{\"redir ي صلاحيتها أبدًا\",\"benefit4Desc\":\"استخدم ما تشتريه على وتيرتك الخاصة. تبقى الباقات في حسابك دون أي ضغط زمني.\",\"benefit5Title\":\"ظهور مميّز أمام العروسين\",\"benefit5Desc\":\"يظهر متجرك في دليل متاجر طباعة بطاقات الزفاف على ChungDoi، ليصل إلى العروسين الباحثين عن متجر قريب منهم، مع رابط يعود إلى موقعك.\",\"processTitle\":\"كيف يعمل\",\"step\":\"الخطوة {n}\",\"step1Title\":\"اشترِ باقة الموزّع\",\"step1Desc\":\"اختر باقة وادفع من هذه الصفحة مباشرة. يُفعّل حساب الموزّع تلقائيًا بمجرد نجاح الدفع.\",\"step2Title\":\"اضبط علامتك التجارية\",\"step2Desc\":\"اعرض اسمك وموقعك وحساب Messenger في أسفل كل دعوة تنشئها.\",\"step3Title\":\"سلّم حسابات العملاء\",\"step3Desc\":\"أنشئ حسابًا ليتمكّن العميل من خدمة نفسه. وحين يحتاج إلى المساعدة، يمكنك الدخول إلى حسابه وإنشاء الدعوة أو تعديلها له.\",\"packagesTitle\":\"باقات الدعوات\",\"packagesSubtitle\":\"باقتك الأولى تُفعّل حساب الموزّع. الباقات لا تنتهي صلاحيتها، وكل دعوة تحمل علامتك التجارية.\",\"packageUnit\":\"دعوة\",\"packagePopular\":\"الأكثر شيوعًا\",\"packagesBrandNote\":\"ضع علامتك التجارية على كل دعوة ودع العملاء يتواصلون معك عبر قناتك الخاصة. بِع أو أهدِ بالسعر الذي تحدّده.\",\"featuresTitle\":\"ميزات الموزّع\",\"feature1Title\":\"لوحة تحكم مخصّصة\",\"feature1Desc\":\"تعرض لوحة تحكمك عدد الدعوات المتبقية وقائمة العملاء وجميع الدعوات المنشأة.\",\"feature2Title\":\"إنشاء حسابات العملاء\",\"feature2Desc\":\"أنشئ حسابات للعملاء بسرعة عبر البريد الإلكتروني. يتلقّون رابط تسجيل دخول تلقائي.\",\"feature3Title\":\"إدارة حسابات العملاء\",\"feature3Desc\":\"ادخل إلى حسابات العملاء للمساعدة في تعديل الدعوات. ويظل بإمكان العملاء إدارة حساباتهم بأنفسهم.\",\"feature4Title\":\"مركز موارد المبيعات\",\"feature4Desc\":\"تتضمّن لوحة تحكم الموزّع مقاطع فيديو لدعوات تجريبية ومنشورات نموذجية ولافتة ونماذج محاكاة ونصوص استشارية لتقديم ChungDoi بشكل أسرع.\",\"feature5Title\":\"دعم ذو أولوية\",\"feature5Desc\":\"يتمتّع الموزّعون بدعم ذي أولوية عبر Messenger.\",\"faqTitle\":\"الأسئلة الشائعة\",\"faq1Q\":\"هل للدعوات المفعّلة تاريخ انتهاء؟\",\"faq1A\":\"الدعوات المفعّلة صالحة **بشكل دائم**، بمشاهدات وعدد ضيوف غير محدودين.\",\"faq2Q\":\"هل يمكنني إنشاء دعوات نيابةً عن العملاء؟\",\"faq2A\":\"نعم. سير العمل الرئيسي هو **إنشاء حساب للعميل**، ثم إرسال رابط تسجيل الدخول له ليتمكّن من إنشاء الدعوة وتعديلها بنفسه. وحين يحتاج إلى المساعدة، يمكنك **الدخول إلى حساب العميل مباشرةً** لإنشاء الدعوة أو تعديلها له.\",\"faq3Q\":\"هل يمكن للعملاء إدارة دعواتهم بأنفسهم؟\",\"faq3A\":\"نعم. بمجرد إنشاء الحساب، يمكن للعملاء تسجيل الدخول في أي وقت لعرض دعواتهم وتعديلها.\",\"faq4Q\":\"هل تنتهي صلاحية باقات الدعوات؟\",\"faq4A\":\"لا. تبقى الباقات المشتراة في حساب الموزّع الخاص بك وجاهزة للاستخدام؛ ولا تنتهي صلاحيتها أبدًا.\",\"faq5Q\":\"كيف أبدأ؟\",\"faq5A\":\"اختر باقة من قسم **الباقات** أعلاه وأكمل الدفع. بمجرد نجاح الدفع، يُفعّل حساب الموزّع تلقائيًا وتنتقل مباشرة إلى لوحة الموزّع. لم يعد التسجيل المجاني كموزّع متاحًا.\",\"faq6Q\":\"هل يمكنني شراء مزيد من الدعوات؟\",\"faq6A\":\"نعم. يمكنك تعبئة باقة دعواتك في أي وقت مباشرةً من لوحة تحكم الموزّع.\",\"faq7Q\":\"كيف تظهر علامتي التجارية على الدعوات؟\",\"faq7A\":\"بمجرد إعداد علامتك التجارية، يعرض التذييل اسم علامتك التجارية (مع رابط) بدلًا من ChungDoi، ويفتح زر \\\"تحدّث معنا\\\" تطبيق Messenger الخاص بك. عادةً ما تستضيف كل دعوة نحو 200 ضيف، أي أن نحو 200 شخص يرون علامتك التجارية لكل دعوة. اتركه فارغًا للإبقاء على علامة ChungDoi الافتراضية.\",\"ctaTitle\":\"ابدأ الشراكة اليوم\",\"ctaDesc\":\"اختر الباقة المناسبة، ويُفعّل حساب الموزّع لحظة إتمام الدفع.\",\"gotoDashboard\":\"اذهب إلى لوحة تحكم الموزّع\",\"activateBtn\":\"فعّل حساب الموزّع\",\"signupBtn\":\"سجّل الدخول لشراء باقة\",\"buyBtn\":\"اشترِ باقة الموزّع\",\"purchaseRequiredNote\":\"شراء الباقة هو ما يجعلك موزّعًا، ويُفعّل الحساب تلقائيًا بعد الدفع مباشرة.\",\"purchaseSuccessNote\":\"حساب الموزّع الخاص بك مُفعّل الآن. افتح لوحة الموزّع لضبط علامتك التجارية وإضافة أول عميل.\",\"activateError\":\"تعذّر تفعيل الموزّع\",\"activateSuccess\":\"تم تفعيل الموزّع بنجاح!\"},\"ctvDashboard\":{\"loadError\":\"تعذّر تحميل معلومات الشرا
